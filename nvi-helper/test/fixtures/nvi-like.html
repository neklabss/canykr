<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>SİMÜLASYON — NVI benzeri test formu</title>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #222; }
    .sim { background: #fff3cd; border: 2px dashed #9a6700; padding: 8px; margin-bottom: 12px; font-weight: 700; }
    h3 { color: #c0703a; font-size: 13px; text-decoration: underline; margin: 18px 0 6px; }
    .row { display: flex; align-items: flex-start; margin: 6px 0; }
    .row > .lbl, .row > label { flex: 0 0 220px; font-weight: 600; font-size: 12px; padding-top: 4px; }
    .row input[type=text] { width: 260px; padding: 4px; }
    .hint { font-size: 12px; margin-top: 2px; }
    .note { background: #fdf6e3; padding: 8px; font-size: 12px; margin: 12px 0; }
    .robot { display: inline-flex; gap: 8px; align-items: center; border: 1px solid #ccc; padding: 12px; margin: 10px 0; background: #f9f9f9; }
    .vk { cursor: pointer; font-size: 12px; color: #555; }
    .keypad { display: none; gap: 4px; margin: 8px 0; }
    .keypad.on { display: flex; }
  </style>
</head>
<body>
  <div class="sim" role="note">SİMÜLASYON: Bu sayfa gerçek NVI sayfası değildir. Alan etiketleri ve sırası NVİ kullanıcı kılavuzundaki (2020) ekran görüntüsünden alınmıştır; HTML yapısı (id/name, etiket bağlantısı) tahminidir.</div>
  <div id="host"></div>
  <script>
  (function () {
    // ?scenario=normal|divlabels|prefilled|ambiguous|late|never|vkeyboard|disabled|noform|rejecting|idonly|iframe|twoframes|iframe-foreign
    var scenario = new URLSearchParams(location.search).get('scenario') || 'normal';
    window.__submitted = 0;
    window.__events = [];

    // divlabels: etiketler <label for> ile BAĞLI DEĞİL; id'ler anlamsız (yakın metin sezgisi testi).
    var plain = scenario === 'divlabels';
    var n = 0;
    function row(id, label, extra, after) {
      var realId = plain ? 'f' + (++n) : id;
      var lbl = plain ? '<div class="lbl">' + label + '</div>' : '<label for="' + realId + '">' + label + '</label>';
      return '<div class="row">' + lbl + '<div><input type="text" id="' + realId + '" ' + (plain ? '' : 'name="' + id + '" ') + (extra || '') + '>' + (after || '') + '</div></div>';
    }

    function formHtml() {
      var h = '<form id="dogrulaForm" action="javascript:void 0">';
      h += '<h3>T.C. KİMLİK NO DOĞRULAMA BİLGİLERİ</h3>';
      h += '<a href="#" class="vk" id="lnkSanalKlavye" role="button" aria-pressed="' + (scenario === 'vkeyboard') + '">⌨ Sanal Klavye Kullan</a>';
      h += '<div class="keypad" id="keypad"><button type="button">1</button><button type="button">2</button><button type="button">3</button></div>';
      if (scenario === 'idonly') {
        h += '<input type="text" id="TCKimlikNo" maxlength="11"><input type="text" id="Ad"><input type="text" id="Soyad">' +
             '<input type="text" id="DogumGun" maxlength="2"><input type="text" id="DogumAy" maxlength="2"><input type="text" id="DogumYili" maxlength="4">';
      } else {
        h += row('txtTc', 'T.C. Kimlik No', 'maxlength="11"');
        h += row('txtAd', 'Adı', scenario === 'prefilled' ? 'value="ÖNCEDEN"' : '');
        h += row('txtSoyad', 'Soyad', scenario === 'disabled' ? 'disabled' : '',
          '<div class="hint"><label><input type="checkbox" id="chkSoyadYok"> Soyadı Nüfus Kayıtlarında Yok.</label></div>');
        if (scenario === 'ambiguous') h += row('txtSoyad2', 'Soyad');
        h += row('txtGun', 'Doğum Gün', 'maxlength="2"');
        h += row('txtAy', 'Doğum Ay', 'maxlength="2"');
        h += row('txtYil', 'Doğum Yılı', 'maxlength="4"');
        h += '<h3>NÜFUS CÜZDANI DOĞRULAMA BİLGİLERİ</h3>' + row('txtCuzdanSeri', 'Seri No', 'placeholder="örn: A0123456"');
        h += '<h3>TÜRKİYE CUMHURİYETİ KİMLİK KARTI</h3>' + row('txtKartSeri', 'Seri No', 'placeholder="örn: A01B23456"');
        h += '<h3>TÜRKİYE CUMHURİYETİ GEÇİCİ KİMLİK BELGESİ</h3>' + row('txtGeciciNo', 'Geçici Kimlik Belge No', 'placeholder="örn: 123456"');
      }
      h += '<div class="note">Cüzdan Seri ve No alanlarının doldurulması ile kişiye ait son aktif Nüfus Cüzdanı üzerinde yazan bilgilerin doğrulanması sağlanacaktır.</div>';
      // reCAPTCHA yerine geçen yerel taklit (gerçekte google.com iframe'i).
      h += '<div class="robot"><input type="checkbox" id="chkRobot" aria-label="Ben robot değilim"> Ben robot değilim</div>';
      h += '<div><button type="submit" id="btnDogrula">Doğrula</button></div></form>';
      return h;
    }

    function applyVirtualKeyboard() {
      var on = document.getElementById('lnkSanalKlavye').getAttribute('aria-pressed') === 'true';
      document.getElementById('keypad').classList.toggle('on', on);
      // Varsayım (doğrulanmadı): sanal klavye açıkken alanlar salt okunur olur.
      document.querySelectorAll('#dogrulaForm input[type=text]').forEach(function (el) { el.readOnly = on; });
    }

    function mount() {
      document.getElementById('host').innerHTML = formHtml();
      var f = document.getElementById('dogrulaForm');
      f.addEventListener('submit', function (e) { e.preventDefault(); window.__submitted++; });
      document.getElementById('btnDogrula').addEventListener('click', function () { window.__submitted++; });
      f.addEventListener('input', function (e) { window.__events.push('input:' + e.target.id); });
      f.addEventListener('change', function (e) { window.__events.push('change:' + e.target.id); });
      document.getElementById('lnkSanalKlavye').addEventListener('click', function (e) {
        e.preventDefault();
        this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        applyVirtualKeyboard();
      });
      applyVirtualKeyboard();
      if (scenario === 'rejecting') {
        // Sayfa betiği değeri kabul etmiyor (ör. maskeleme) — doldurma "rejected" dönmeli.
        document.getElementById('txtYil').addEventListener('input', function (e) { e.target.value = ''; });
      }
    }

    if (scenario === 'noform') return;
    if (scenario === 'iframe' || scenario === 'twoframes' || scenario === 'iframe-foreign') {
      var frame = function (src) { return '<iframe src="' + src + '" title="Form çerçevesi" style="width:100%;height:520px;border:1px solid #999"></iframe>'; };
      var html = frame('?scenario=normal');
      if (scenario === 'twoframes') html += frame('?scenario=normal&ikinci=1');
      if (scenario === 'iframe-foreign') html = frame('https://example.invalid/reklam') + html;
      document.getElementById('host').innerHTML = html;
      return;
    }
    if (scenario === 'never') { document.getElementById('host').textContent = 'Yükleniyor…'; return; }
    if (scenario === 'late') { setTimeout(mount, 1200); return; }
    mount();
  })();
  </script>
</body>
</html>
